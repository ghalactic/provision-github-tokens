# yaml-language-server: $schema=https://ghalactic.github.io/provision-github-tokens/schema/provider.v1.schema.json
$schema: https://ghalactic.github.io/provision-github-tokens/schema/provider.v1.schema.json

permissions:
  rules: []

provision:
  rules:
    secrets:
      - secrets: ["*"]
        requesters: ["*/*"]
        to:
          github:
            account:
              types: {}
            accounts: {}
            repo:
              types:
                environments: {}
            repos:
              "account-a/repo-default":
                types:
                  actions: allow
              "account-a/repo-explicit":
                visibility: internal
                types:
                  actions: allow
